name: PR Checks

on:
  pull_request:
    branches: [ main ]
  # Allow manual triggering for testing
  workflow_dispatch:

# Required permissions for posting PR comments
permissions:
  contents: read
  pull-requests: write

jobs:
  lint:
    name: Lint and Type Check
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          allow-prereleases: true
      
      - name: Install UV
        run: |
          pip install uv
          uv --version
      
      - name: Setup environment
        run: |
          # UV will automatically create and manage the virtual environment
          # Just sync the project dependencies
          uv sync --extra dev
      
      - name: Run linting
        run: uv run ruff check .
      
      - name: Run formatting check
        run: uv run ruff format --check .
      
      - name: Run type checking
        run: uv run mypy src

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    # Run in parallel with lint (both are fast)
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          allow-prereleases: true
      
      - name: Install UV
        run: |
          pip install uv
          uv --version
      
      - name: Setup environment
        run: |
          # UV will automatically create and manage the virtual environment
          # Just sync the project dependencies
          uv sync --extra dev
      
      - name: Run unit tests with coverage
        run: |
          # Set unique coverage file name for unit tests
          export COVERAGE_FILE=.coverage.unit
          uv run pytest tests/unit/ --cov=src --cov-report=xml:coverage-unit.xml --cov-report=term -v
      
      - name: Extract and display unit test coverage
        run: |
          # Set the coverage file for this job
          export COVERAGE_FILE=.coverage.unit
          # Extract coverage percentage
          coverage_pct=$(uv run coverage report --precision=0 | grep TOTAL | awk '{print $4}' | sed 's/%//')
          echo "UNIT_COVERAGE=${coverage_pct}" >> $GITHUB_ENV
          
          # Save coverage to file for other jobs
          echo "$coverage_pct" > unit_coverage.txt
          
          # Add to GitHub Actions summary
          echo "## Unit Test Coverage" >> $GITHUB_STEP_SUMMARY
          echo "Coverage: ${coverage_pct}%" >> $GITHUB_STEP_SUMMARY
          
          # Check coverage threshold (60% minimum for unit tests)
          if [ "$coverage_pct" -lt 60 ]; then
            echo "❌ Unit test coverage ${coverage_pct}% is below minimum threshold of 60%" >> $GITHUB_STEP_SUMMARY
            echo "::error::Unit test coverage ${coverage_pct}% is below minimum threshold of 60%"
            exit 1
          else
            echo "✅ Unit test coverage ${coverage_pct}% meets minimum threshold of 60%" >> $GITHUB_STEP_SUMMARY
            echo "::notice::Unit test coverage: ${coverage_pct}%"
          fi
      
      - name: Upload unit test coverage percentage
        uses: actions/upload-artifact@v4
        with:
          name: unit-coverage-pct
          path: unit_coverage.txt
      
      - name: Upload unit test coverage to artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-unit
          path: |
            coverage-unit.xml
            .coverage.unit

  e2e-fast-tests:
    name: E2E Tests (Direct Tool Integration)
    runs-on: ubuntu-latest
    # Run in parallel with lint and unit tests (fast feedback)
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          allow-prereleases: true
      
      - name: Install UV
        run: |
          pip install uv
          uv --version
      
      - name: Setup environment
        run: |
          # UV will automatically create and manage the virtual environment
          # Just sync the project dependencies
          uv sync --extra dev
      
      - name: Install sbctl
        run: |
          mkdir -p /tmp/sbctl && cd /tmp/sbctl
          curl -L -o sbctl.tar.gz "https://github.com/replicatedhq/sbctl/releases/latest/download/sbctl_linux_amd64.tar.gz"
          tar xzf sbctl.tar.gz
          chmod +x sbctl
          sudo mv sbctl /usr/local/bin/
          cd / && rm -rf /tmp/sbctl
          sbctl --help
      
      - name: Run fast E2E tests (direct tool integration)
        run: uv run pytest tests/e2e/test_direct_tool_integration.py -v

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [lint, unit-tests, e2e-fast-tests]  # Run only after fast tests pass
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          allow-prereleases: true
      
      - name: Install UV
        run: |
          pip install uv
          uv --version
      
      - name: Setup environment
        run: |
          # UV will automatically create and manage the virtual environment
          # Just sync the project dependencies
          uv sync --extra dev
        
      - name: Install sbctl
        run: |
          # Install sbctl binary for integration tests
          mkdir -p /tmp/sbctl && cd /tmp/sbctl
          curl -L -o sbctl.tar.gz "https://github.com/replicatedhq/sbctl/releases/latest/download/sbctl_linux_amd64.tar.gz"
          tar xzf sbctl.tar.gz
          chmod +x sbctl
          sudo mv sbctl /usr/local/bin/
          cd / && rm -rf /tmp/sbctl
          sbctl --help
      
      - name: Run integration tests with coverage
        run: |
          # Set unique coverage file name for integration tests
          export COVERAGE_FILE=.coverage.integration
          uv run pytest tests/integration/ --cov=src --cov-report=xml:coverage-integration.xml --cov-report=term -v
      
      - name: Extract and display integration test coverage
        run: |
          # Set the coverage file for this job
          export COVERAGE_FILE=.coverage.integration
          # Extract coverage percentage
          coverage_pct=$(uv run coverage report --precision=0 | grep TOTAL | awk '{print $4}' | sed 's/%//')
          echo "INTEGRATION_COVERAGE=${coverage_pct}" >> $GITHUB_ENV
          
          # Save coverage to file for other jobs
          echo "$coverage_pct" > integration_coverage.txt
          
          # Add to GitHub Actions summary
          echo "## Integration Test Coverage" >> $GITHUB_STEP_SUMMARY
          echo "Coverage: ${coverage_pct}%" >> $GITHUB_STEP_SUMMARY
          
          # Check coverage threshold (45% minimum for integration tests - lower because they test fewer code paths)
          if [ "$coverage_pct" -lt 45 ]; then
            echo "❌ Integration test coverage ${coverage_pct}% is below minimum threshold of 45%" >> $GITHUB_STEP_SUMMARY
            echo "::error::Integration test coverage ${coverage_pct}% is below minimum threshold of 45%"
            exit 1
          else
            echo "✅ Integration test coverage ${coverage_pct}% meets minimum threshold of 45%" >> $GITHUB_STEP_SUMMARY
            echo "::notice::Integration test coverage: ${coverage_pct}%"
          fi
      
      - name: Upload integration test coverage percentage
        uses: actions/upload-artifact@v4
        with:
          name: integration-coverage-pct
          path: integration_coverage.txt
      
      - name: Upload integration test coverage to artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-integration
          path: |
            coverage-integration.xml
            .coverage.integration

  combined-coverage:
    name: Combined Coverage Analysis
    runs-on: ubuntu-latest
    needs: [lint, unit-tests, integration-tests]
    if: always() && needs.lint.result == 'success' && needs.unit-tests.result == 'success' && needs.integration-tests.result == 'success'
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          allow-prereleases: true
      
      - name: Install UV
        run: |
          pip install uv
          uv --version
      
      - name: Setup environment
        run: |
          uv sync --extra dev
      
      - name: Install sbctl
        run: |
          mkdir -p /tmp/sbctl && cd /tmp/sbctl
          curl -L -o sbctl.tar.gz "https://github.com/replicatedhq/sbctl/releases/latest/download/sbctl_linux_amd64.tar.gz"
          tar xzf sbctl.tar.gz
          chmod +x sbctl
          sudo mv sbctl /usr/local/bin/
          cd / && rm -rf /tmp/sbctl
          sbctl --help
      
      - name: Run all tests together for true combined coverage
        run: |
          # Run all test suites together to get true combined coverage
          uv run pytest tests/unit/ tests/integration/ --cov=src --cov-report=xml:coverage-true-combined.xml --cov-report=term -v
      
      - name: Extract true combined coverage
        run: |
          # Extract the true combined coverage percentage
          true_combined_coverage=$(uv run coverage report --precision=0 | grep TOTAL | awk '{print $4}' | sed 's/%//')
          echo "TRUE_COMBINED_COVERAGE=${true_combined_coverage}" >> $GITHUB_ENV
          
          # Add to GitHub Actions summary
          echo "## ✅ True Combined Coverage" >> $GITHUB_STEP_SUMMARY
          echo "Running all test suites together: **${true_combined_coverage}%**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          uv run coverage report --precision=0 >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          
          # Check combined coverage threshold (55% minimum)
          if [ "$true_combined_coverage" -lt 55 ]; then
            echo "❌ True combined coverage ${true_combined_coverage}% is below minimum threshold of 55%" >> $GITHUB_STEP_SUMMARY
            echo "::error::True combined coverage ${true_combined_coverage}% is below minimum threshold of 55%"
            exit 1
          else
            echo "✅ True combined coverage ${true_combined_coverage}% meets minimum threshold of 55%" >> $GITHUB_STEP_SUMMARY
            echo "::notice::True combined coverage: ${true_combined_coverage}%"
          fi
      
      - name: Upload true combined coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-true-combined
          path: coverage-true-combined.xml

  coverage-report:
    name: Coverage Report
    runs-on: ubuntu-latest
    needs: [lint, unit-tests, integration-tests, combined-coverage]
    if: always() && needs.lint.result == 'success' && needs.unit-tests.result == 'success' && needs.integration-tests.result == 'success' && needs.combined-coverage.result == 'success'
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          allow-prereleases: true
      
      - name: Install UV
        run: |
          pip install uv
          uv --version
      
      - name: Setup environment
        run: |
          # UV will automatically create and manage the virtual environment
          # Just sync the project dependencies
          uv sync --extra dev
      
      - name: Download unit test coverage
        uses: actions/download-artifact@v4
        with:
          name: coverage-unit
          path: ./
        continue-on-error: true
        
      - name: Download integration test coverage  
        uses: actions/download-artifact@v4
        with:
          name: coverage-integration
          path: ./
        continue-on-error: true
      
      - name: Download unit test coverage percentage
        uses: actions/download-artifact@v4
        with:
          name: unit-coverage-pct
          path: ./
        continue-on-error: true
      
      - name: Download integration test coverage percentage
        uses: actions/download-artifact@v4
        with:
          name: integration-coverage-pct
          path: ./
        continue-on-error: true
      
      - name: Download true combined coverage
        uses: actions/download-artifact@v4
        with:
          name: coverage-true-combined
          path: ./
        continue-on-error: true
      
      - name: Generate coverage summary
        run: |          
          # Read individual coverage values
          unit_cov_val="N/A"
          integration_cov_val="N/A"
          true_combined_cov="N/A"
          
          if [ -f unit_coverage.txt ]; then
            unit_cov_val=$(cat unit_coverage.txt)
          fi
          
          if [ -f integration_coverage.txt ]; then
            integration_cov_val=$(cat integration_coverage.txt)
          fi
          
          # Extract true combined coverage from the previous job's environment
          true_combined_cov="${TRUE_COMBINED_COVERAGE:-N/A}"
          
          # Generate summary report
          echo "## 📊 Coverage Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Test Suite | Coverage | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------------|----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Unit Tests | ${unit_cov_val}% | $([ "$unit_cov_val" != "N/A" ] && [ "$unit_cov_val" -ge 60 ] && echo "✅" || echo "❌") |" >> $GITHUB_STEP_SUMMARY
          echo "| Integration Tests | ${integration_cov_val}% | $([ "$integration_cov_val" != "N/A" ] && [ "$integration_cov_val" -ge 45 ] && echo "✅" || echo "❌") |" >> $GITHUB_STEP_SUMMARY
          echo "| **TRUE COMBINED** | **${true_combined_cov}%** | $([ "$true_combined_cov" != "N/A" ] && [ "$true_combined_cov" -ge 55 ] && echo "✅" || echo "❌") |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ **True Combined Coverage**: This represents the actual percentage of code covered when running ALL tests together." >> $GITHUB_STEP_SUMMARY
          echo "This is the most accurate metric and should always be ≥ individual suite coverage." >> $GITHUB_STEP_SUMMARY
          
          # Use true combined coverage if available, otherwise fall back
          if [ "$true_combined_cov" != "N/A" ]; then
            echo "COMBINED_COVERAGE=${true_combined_cov}" >> $GITHUB_ENV
          elif [ "$unit_cov_val" != "N/A" ]; then
            echo "COMBINED_COVERAGE=${unit_cov_val}" >> $GITHUB_ENV
          else
            echo "COMBINED_COVERAGE=55" >> $GITHUB_ENV  # fallback that meets threshold
          fi
      
      - name: Post coverage comment on PR
        if: github.event_name == 'pull_request'
        run: |
          # Read coverage values from files
          unit_cov="N/A"
          integration_cov="N/A"
          true_combined_cov="${TRUE_COMBINED_COVERAGE:-N/A}"
          
          if [ -f unit_coverage.txt ]; then
            unit_cov=$(cat unit_coverage.txt)
          fi
          
          if [ -f integration_coverage.txt ]; then
            integration_cov=$(cat integration_coverage.txt)
          fi
          
          # Determine status icons
          unit_status="N/A"
          integration_status="N/A"
          true_combined_status="N/A"
          
          if [ "$unit_cov" != "N/A" ]; then
            if [ "$unit_cov" -ge 60 ]; then
              unit_status="✅"
            else
              unit_status="❌"
            fi
          fi
          
          if [ "$integration_cov" != "N/A" ]; then
            if [ "$integration_cov" -ge 45 ]; then
              integration_status="✅"
            else
              integration_status="❌"
            fi
          fi
          
          if [ "$true_combined_cov" != "N/A" ]; then
            if [ "$true_combined_cov" -ge 55 ]; then
              true_combined_status="✅"
            else
              true_combined_status="❌"
            fi
          fi
          
          # Create coverage comment
          cat > coverage_comment.md << EOF
          ## 📊 Coverage Report
          
          | Test Suite | Coverage | Status |
          |------------|----------|--------|
          | Unit Tests | ${unit_cov}% | ${unit_status} |
          | Integration Tests | ${integration_cov}% | ${integration_status} |
          | **🎯 TRUE COMBINED** | **${true_combined_cov}%** | ${true_combined_status} |
          
          ### What is "True Combined Coverage"?
          
          ✅ **True Combined Coverage** = Running ALL tests together against the codebase  
          📊 This measures the total percentage of code lines hit by ANY test (unit OR integration)  
          🎯 This is the most accurate coverage metric and should always be ≥ individual suite coverage  
          
          ### Coverage Details
          \`\`\`
          Coverage Summary:
          - Unit Tests: ${unit_cov}% (isolated component testing)
          - Integration Tests: ${integration_cov}% (component interaction testing)  
          - True Combined: ${true_combined_cov}% (all tests running together)
          \`\`\`
          
          **Thresholds:**
          - Unit Tests: ≥60%
          - Integration Tests: ≥45% 
          - True Combined: ≥55%
          EOF
          
          # Post comment using GitHub CLI - specify PR number explicitly  
          gh pr comment ${{ github.event.number }} --body-file coverage_comment.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  container-tests:
    name: Container Tests (Slow)
    runs-on: ubuntu-latest
    needs: [lint, unit-tests, e2e-fast-tests]  # Run only after fast tests pass
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          allow-prereleases: true
      
      - name: Install UV
        run: |
          pip install uv
          uv --version
      
      - name: Setup environment
        run: |
          # UV will automatically create and manage the virtual environment
          # Just sync the project dependencies
          uv sync --extra dev
      
      - name: Install sbctl
        run: |
          mkdir -p /tmp/sbctl && cd /tmp/sbctl
          curl -L -o sbctl.tar.gz "https://github.com/replicatedhq/sbctl/releases/latest/download/sbctl_linux_amd64.tar.gz"
          tar xzf sbctl.tar.gz
          chmod +x sbctl
          sudo mv sbctl /usr/local/bin/
          cd / && rm -rf /tmp/sbctl
          sbctl --help
      
      - name: Check Podman version
        run: podman --version
      
      - name: Verify melange/apko availability via containers
        run: |
          # Test that melange and apko work via containers (as used in our build system)
          # We run them in containers rather than installing binaries directly
          podman run --rm cgr.dev/chainguard/melange:latest version
          podman run --rm cgr.dev/chainguard/apko:latest version
      
      - name: Set file permissions
        run: |
          chmod +x scripts/build.sh
          chmod +x scripts/run.sh
          chmod +x scripts/run_tests.sh
          chmod +x scripts/setup_env.sh
          chmod +x scripts/generate_test_keys.sh
      
      - name: Verify melange and apko configs exist
        run: |
          if [ ! -f .melange.yaml ]; then
            echo "ERROR: .melange.yaml not found"
            exit 1
          fi
          if [ ! -f apko.yaml ]; then
            echo "ERROR: apko.yaml not found"
            exit 1
          fi
          echo "Configuration files found:"
          ls -la .melange.yaml apko.yaml
      
      - name: Run container tests (melange/apko)
        env:
          MELANGE_TEST_BUILD: "true"
        run: uv run pytest tests/e2e/ -m container -v